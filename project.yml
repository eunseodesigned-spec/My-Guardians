name: MyGuardians
options:
  bundleIdPrefix: com.objectguardians
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  MyGuardians:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: MyGuardians
    info:
      path: MyGuardians/Info.plist
      properties:
        CFBundleDisplayName: My Guardians
        CFBundleName: My Guardians
        CFBundleShortVersionString: '0.2.0'
        CFBundleVersion: '1'
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: 'My Guardians uses the camera to find your objects and capture memories.'
        NSLocationWhenInUseUsageDescription: 'Optionally attach your location to a guardian memory.'
        UIAppFonts:
          - PatrickHand-Regular.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.objectguardians.prototype.b
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MyGuardians/Info.plist
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []
